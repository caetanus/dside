version = 1
SPDX-PackageName = "qt-dlang-gen"
SPDX-PackageSupplier = "Marcelo A Caetano"
SPDX-PackageDownloadLocation = "https://github.com/mcaetano/qt-dlang-gen"

# Machine-readable license coverage, per docs/licensing-plan.md. Files that can carry a comment
# carry their own SPDX header; this file covers the ones that cannot, and states the terms of the
# third-party material the repository contains.
#
# The rule this file must never break: an annotation here NEVER contradicts a header. Where upstream
# wrote its own SPDX line, that line is the truth and the entry below repeats it rather than
# replacing it.

# --- project-authored data files that cannot carry a comment ---------------------------------

[[annotations]]
path = ["**/*.json", "**/*.tsv", "**/*.txt", "**/*.set", "**/*.qrc", "**/*.baseline"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Marcelo A Caetano"
SPDX-License-Identifier = "BSL-1.0"

# The QML and .ui fixtures written for this project. Qt's own documents are NOT here: they are read
# from the installed Qt at test time and never copied into the tree (see THIRD-PARTY.md).
[[annotations]]
path = ["tests/qmltc/**/*.qml", "tests/qml/**/*.qml", "tests/uic/*.ui", "tests/qrc/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Marcelo A Caetano"
SPDX-License-Identifier = "BSL-1.0"

# --- third-party, kept exactly as upstream states it -----------------------------------------

# Verbatim copies of the app-defined C++ QML types from Qt's own qmltc test corpus. Every file
# carries this expression in its own header; repeated here so a tool that reads only this file
# reaches the same answer. GPL-3.0-only, and therefore excluded from every installed artifact —
# enforced by the license-no-gpl-product gate, not by this comment.
[[annotations]]
path = ["tests/qmltc/cpptypes/**"]
precedence = "override"
SPDX-FileCopyrightText = "2021 The Qt Company Ltd."
SPDX-License-Identifier = "LicenseRef-Qt-Commercial OR GPL-3.0-only"

# The .ui corpus. THIRD-PARTY.md records what is known and what is not: 13 of the 60 carry a Qt
# copyright line, and the remaining 47 have no header, no recorded upstream revision and no README.
# `NOASSERTION` is the honest expression for a file whose terms are not established — it is not a
# license, it is the absence of one, and Phase 1 of the licensing plan exists to remove it.
[[annotations]]
path = ["tests/uic/corpus/**"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "NOASSERTION"
