<!--
SPDX-FileCopyrightText: 2026 Marcelo A Caetano
SPDX-License-Identifier: BSL-1.0

The xiboca logo. Xiboquinha is a Brazilian drink — cachaça with ginger and
honey — and the mark is the still that makes the cachaça, because a wrapper
generator does what a still does: raw material goes in, something distilled
comes out. The drop leaving the swan neck is the output.

Unlike DSide's, this mark borrows no shape from Qt. The two belong to the same
family through flat drawing and a shared neutral, not through geometry: a tool
should not wear the badge of the library it targets.

The seal is the primary form. Measured at 26 px the still alone loses its swan
neck and becomes a blob, while the seal survives, which is why the icon is the
seal and not the still.

Wordmark and signature are outlined from Noto Sans (Bold 86 px, Regular 13 px
with 3.4 tracking), so they render identically without the font installed.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="548" height="220" viewBox="0 0 548 220">
  <defs>
    <!-- the still: pot, capitel, swan neck and foot -->
    <g id="alambique">
      <circle cx="70" cy="118" r="40"/>
      <path d="M52,92 C54,70 60,52 70,52 C80,52 86,70 88,92 Z"/>
      <path d="M82,60 C112,52 132,70 134,94 C135,112 135,122 135,130"
            fill="none" stroke-width="10" stroke-linecap="round"/>
      <rect x="44" y="152" width="52" height="11" rx="5"/>
    </g>
    <path id="gota" d="M0,0 C7,13 11,20 11,25 A11,11 0 1 1 -11,25 C-11,20 -7,13 0,0 Z"/>
  </defs>

  <g transform="translate(110,110)">
    <circle r="96" fill="#E0A02B"/>
    <circle r="84" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
    <g transform="matrix(0.86,0,0,0.86,-64,-112)" fill="#FFFFFF" stroke="#FFFFFF">
      <use href="#alambique"/>
    </g>
    <g transform="matrix(0.46,0,0,0.46,52,24)" fill="#FFFFFF" stroke="none">
      <use href="#gota"/>
    </g>
  </g>

