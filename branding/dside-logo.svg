      <stop stop-color="#fff" stop-opacity="0" offset="1"/>
    </linearGradient>

    <!-- the crop the D artwork travels in: it overhangs the block by 6 units, which
         is what lets the D and the moons reach across onto the green -->
    <clipPath id="dcrop"><rect x="193" y="0" width="108" height="89"/></clipPath>
    <!-- the block itself, so the planet stops where the grey stops -->
    <clipPath id="blockcrop"><rect x="189.44" y="0" width="108" height="89"/></clipPath>
  </defs>

  <!-- the grey field -->
  <rect width="182" height="150" fill="#3A4048"/>

