  <g clip-path="url(#blockcrop)" transform="matrix(1.6854,0,0,1.6854,-319.28,0)">
    <g transform="translate(181,0)">
      <ellipse cx="-4.5" cy="308" rx="310" ry="266" fill="url(#planet)" opacity="0.3"/>
    </g>
  </g>

