The DSide logo: the D language's own mark on a desaturated field, joined to Qt's
badge shape carrying the word `side`. The cut corner is Qt's; it falls on the
junction, so the two blocks interlock rather than sit next to each other, and the
D and both of its moons cross onto the green.

PROVENANCE OF THE D ARTWORK — the planet, both moons and the D glyph are the
upstream paths, used verbatim, with only the field colour changed from #B03931 to
a neutral grey:

    repository  https://github.com/dlang/dlang.org
    path        images/dlogo.svg
    revision    5da9a709c2905693c148e258740d0484587d0a3d (2016-01-24)
    sha256      e96ad4c51cde5411e63221400acfaa0f77b8234600f9163bca583d1ea4b21fbc
    retrieved   2026-08-18
    licence     BSL-1.0, per LICENSE.txt of that repository

The upstream file's own comments name the parts: `planet`, `bigger moon`,
`smaller moon`. The moons are Phobos and Deimos, which is why D's standard
library is called Phobos.

A licence is not a trademark grant. BSL-1.0 covers copying this artwork; it says
nothing about using the D Language Foundation's or The Qt Company's marks to
identify a product. Neither organisation endorses this project.
-->
