The square DSide icon, for favicons and application icons. The word cannot
survive at 16 px, so the icon drops it and keeps what does: the D, both moons,
and Qt's cut corner arriving from the right in green.

The D artwork's provenance is recorded in dside-logo.svg, and the same terms and
the same trademark caveat apply here.
-->
