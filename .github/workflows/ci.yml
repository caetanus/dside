# CI (critics r5 #5 / r7 #1 / r8 #1). Runs generate -> build -> test on Linux across dmd AND ldc2
# with distro Qt5 AND Qt6, and enforces the Qt-version-INDEPENDENT gates. The manifest gates are
# ADVISORY here (see below) — an honest limitation, not a hidden one.
#
# Whether the default `./build` runs the manifest gates is decided by the Qt it finds: the gates are
# MANDATORY when the installed Qt minor equals the one the baselines were recorded against, and
# OPTIONAL (reachable by name, excluded from defaultTargets) otherwise. On a runner whose distro Qt
# is a different minor they therefore stay out of the mandatory matrix step and are run by the
# SEPARATE advisory step below (continue-on-error) — the r8 #1 split, now conditioned on the actual
# version instead of disabling the gate everywhere including the machines it is valid on.
#
# STILL a scaffold, NOT proven green on a real runner. Two things are genuinely unresolved and
# stated openly:
#  1) Ubuntu's distro Qt6 (~6.4 on 24.04) is a DIFFERENT MINOR than the baselines (Qt 6.11). The
#     manifest gate would then measure SDK diff, not a generator regression — so the manifest
#     gates are optional + run advisory until per-Qt-minor baselines exist (r7 #7). The
#     version-independent gates (expected-fails-lint, lupdate-check) stay MANDATORY (in default).
#  2) The private QML APIs (QQmlPrivate::RegisterType, QtQmlCompiler) may differ on 6.4; those
#     targets (qmlreg/qmltypes) may need Qt-minor handling — that is the versioned risk we track.
name: CI
on:
  push:
    branches: [master, codegen-tools]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_full:
        description: "Run the FULL Windows matrix instead of the slice (hours, may hit the job cap)"
        type: boolean
        default: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5 + Qt6 (dev + private + tools), WebEngine, clang/libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qtbase5-private-dev qtdeclarative5-dev qtdeclarative5-private-dev \
            qttools5-dev qttools5-dev-tools libqt5webenginecore5 qtwebengine5-dev \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-declarative-private-dev \
            qt6-declarative-dev-tools qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-webengine-dev qt6-webengine-dev-tools \
            clang libclang-dev llvm-dev pkg-config

      # THE QML MODULES ARE A SEPARATE INSTALL, and without them the runner has a Qt Quick with no
      # Controls — which the build correctly turns into `qmltc-o3-gate-skipped` instead of the five
      # per-style gates, and which the assertion below correctly refuses. Run 33707504655 died on
      # exactly that: `missing o3 gate: qmltc-o3-gate-Basic`, with 957 qmltc targets present.
      #
      # Installed rather than asserted away. Weakening the check to accept the skip would make the
      # runner's coverage a property of what apt happened to pull in, which is the shape of silent
      # capability loss this workflow already has one comment about.
      - name: Install the QML runtime modules (QtQuick.Controls and what it depends on)
        run: |
          sudo apt-get install -y --no-install-recommends \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-shapes \
            qml6-module-qtqml-workerscript qml6-module-qtqml-models \
            qml-module-qtquick2 qml-module-qtquick-controls2
          echo "Qt6 QML dir: $(qmake6 -query QT_INSTALL_QML)"
          ls "$(qmake6 -query QT_INSTALL_QML)/QtQuick/Controls" | head

      # The 58 sample_* targets that materialize the PySide north (shiboken's libsample corner
      # cases) only exist if ../pyside-setup is present — otherwise libsampleTargets() returns [].
      # Provision it at a PINNED revision so conformance can't silently vanish.
      # PINNED, no fallback (critics r8 #7): if the tag/clone fails, the JOB fails — we do NOT
      # silently fall back to cloning HEAD (which would make "PINNED" a lie and let the corpus
      # drift under CI). A reproducible corpus is the whole point of pinning.
      - name: Provision shiboken libsample corpus (pinned 6.8.0, no fallback)
        run: |
          git clone --depth 1 --branch 6.8.0 https://code.qt.io/pyside/pyside-setup.git \
            "$GITHUB_WORKSPACE/../pyside-setup"

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - name: Install ldc2
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      # `libs-posix: ["clang"]` in xiboca/dub.json asks the linker for `-lclang`, and that is the
      # right thing for the package to say: it is a fact about the generator, not about a distro.
      # Ubuntu does not put a bare `libclang.so` anywhere on the default search path — the
      # development symlink lives under `/usr/lib/llvm-<N>/lib`, and the versioned runtime under
      # `/usr/lib/x86_64-linux-gnu/libclang-<N>.so.1`. Every run of this workflow so far died here:
      #
      #     /usr/bin/ld: cannot find -lclang: No such file or directory
      #
      # Asked of `llvm-config` rather than written as a version, so a runner image bump does not
      # break it again, and REFUSED LOUDLY if the file is not where llvm-config says the libdir is —
      # a silent miss would come back as the same link error six steps later.
      - name: Put libclang on the link path
        run: |
          cfg=$(command -v llvm-config || ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1)
          test -n "$cfg" || { echo "::error::no llvm-config; llvm-dev did not install"; exit 1; }
          libdir=$("$cfg" --libdir)
          echo "llvm-config: $cfg -> $libdir"
          test -e "$libdir/libclang.so" || {
            echo "::error::no libclang.so in $libdir"; ls "$libdir" | grep -i clang || true; exit 1; }
          echo "LIBRARY_PATH=$libdir${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build the generator (xiboca)
        run: cd xiboca && dub build

      - name: Generate the reggae build binary
        run: dub run reggae -- -b binary . --reggaefile-import-path "$PWD/reggae"

      # CONFORMANCE (critics r8 #7): a mere n>0 would pass a partial corpus. Assert the full known
      # contract — 58 sample_* targets (29 cases x ldc2/dmd) — AND that specific CANARY cases exist,
      # so a truncated or reshuffled corpus fails loudly instead of going green on one target.
      - name: Assert libsample conformance corpus is complete
        run: |
          n=$(./build --list 2>/dev/null | grep -c '^- sample_' || true)
          echo "libsample targets: $n (expected 58)"
          test "$n" -ge 58 || { echo "::error::libsample corpus incomplete: $n < 58 (pyside-setup partial or unpinned?)"; exit 1; }
          for canary in sample_cornercases-ldc2 sample_cornercases-dmd sample_exceptions-ldc2 sample_color-ldc2; do
            ./build --list 2>/dev/null | grep -qE "^- ${canary}\$" || { echo "::error::missing canary conformance target: $canary"; exit 1; }
          done

      # THE SAME FLOOR FOR THE BIGGEST SUITE (critics r10 #5, open since then). libsample gets a
      # count and canaries above; the qmltc families — which are most of the graph and the only
      # thing that measures the QML compiler against the engine — got neither, so on a runner
      # without QtQuick.Controls they would simply not be generated and the job would go green over
      # a matrix missing four fifths of itself. A capability that is absent must be a LOUD skip.
      - name: Assert the qmltc suite and its gates are present
        run: |
          n=$(./build --list 2>/dev/null | grep -c '^- qmltc' || true)
          echo "qmltc targets: $n"
          test "$n" -ge 800 || { echo "::error::qmltc suite incomplete: $n < 800 (QtQuick.Controls missing?)"; exit 1; }
          # The o3 gates are the promise itself: every judgeable document behaves like the engine.
          # Named individually because a missing STYLE is the failure mode — o3GateTargets emits a
          # red target for one and a single explicit skip when Controls is absent entirely.
          for g in Basic Fusion Universal Imagine Material app; do
            ./build --list 2>/dev/null | grep -qE "^- qmltc-o3-gate-${g}\$" \
              || { echo "::error::missing o3 gate: qmltc-o3-gate-$g"; exit 1; }
          done
          # THE C++ CORPUS FAMILY, BY NAME AND BY COUNT (round 17 #3). `qmltcCppTypeTargets` used to
          # hardcode `/usr/lib/qt6/moc`; Ubuntu installs it under `libexec/`, both `exists()` checks
          # failed and the function returned an empty list — 182 targets, the only ones that compile
          # Qt's own C++ QML types, silently ceased to exist. The floor above counts `^- qmltc` and
          # would have been satisfied by the other families, so absence of capability read as green.
          # Measured on the reference machine: 182 targets in this family.
          c=$(./build --list 2>/dev/null | grep -c '^- qmltcc-' || true)
          echo "qmltcc (C++ corpus) targets: $c"
          test "$c" -ge 100 || { echo "::error::qmltc C++ corpus family missing or truncated: $c < 100 (moc/qmltyperegistrar not found?)"; exit 1; }
          ./build --list 2>/dev/null | grep -qE '^- qmltcc-CBasic-ldc2$' \
            || { echo "::error::missing qmltcc canary: qmltcc-CBasic-ldc2"; exit 1; }

          # THE LICENSING GATES, for the same reason the others are here: each was written because
          # something went green without it, and a gate that is not asserted present can vanish the
          # way the C++ corpus did.
          # `license-no-gpl-product` is deliberately NOT in this list. Its matrix is keyed by exact
          # Qt release and it refuses to judge one it does not record, so on a runner whose distro Qt
          # is not in the matrix it becomes optional — and optional targets do not appear in
          # `--list`. Requiring it here would fail the floor for the one reason the design already
          # accounts for. It runs in the advisory step below, where its verdict is visible.
          for g in license-coverage license-publishable license-snapshot license-package \
                   license-package-mutations license-coverage-mutations license-snapshot-mutations \
                   license-no-gpl-product-mutations \
                   license-generated-output license-generated-output-mutations; do
            ./build --list 2>/dev/null | grep -qE "^- ${g}\$" \
              || { echo "::error::missing licensing gate: $g"; exit 1; }
          done

          # ...and the lifetime/packaging gates added since, for the same reason: each of them was
          # written because something silently went green without it.
          for g in borrowed-ldc2 nonqobject-ldc2 threadguard-ldc2-qt6 ctor-guard \
                   ownership-gate-qtwidgets consumer-smoke-ldc2 dub-consumer-ldc2; do
            ./build --list 2>/dev/null | grep -qE "^- ${g}\$" \
              || { echo "::error::missing gate: $g"; exit 1; }
          done

      # SINGLE recorded execution (critics r8 #8): the report script builds+runs every mandatory
      # (non-optional) target ONCE, records per-target status/timing/log into report.tsv, and EXITS
      # NON-ZERO if anything failed — so the artifact IS the result that gates the job, not a second
      # matrix pass whose outcome is discarded. Manifest gates are optional (excluded here) and run
      # advisory below. expected-fails-lint and lupdate-check are default targets, so the report
      # covers them too.
      - name: Build + run the full matrix and record (report gates the job)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          bash tools/test-report.sh | tee report.tsv

      - name: Manifest gates (ADVISORY — baselines are Qt 6.11; runner Qt may differ)
        continue-on-error: true
        run: |
          ./build manifest-gate-qtwidgets
          ./build manifest-gate-qml
          ./build manifest-gate-controls
          # ...and the Qt module licence gate, for a DIFFERENT reason worth stating plainly: it is
          # not that its answer would be noisy here, it is that it cannot answer at all. The matrix
          # is keyed by exact release and refuses to apply another release's rows; on this runner it
          # will say so and fail. That failure is the honest report of a real gap — no licensing
          # verification of Qt modules happens on a Qt this project has not audited — and closing it
          # means installing a Qt the matrix records, or auditing the runner's Qt and recording it.
          ./build license-no-gpl-product

      - name: Upload report + coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-and-coverage
          path: |
            report.tsv
            generated/**/coverage.txt
            generated/**/coverage-manifest.tsv
            .build/report-logs/

  # ---------------------------------------------------------------------------------------------
  # WINDOWS / MSVC. The full 1223-target matrix has been run on a VM (docs/windows-roadmap.md); it
  # is NOT what this job runs. A hosted runner is slower than that VM and a GitHub job is capped at
  # six hours, so a full matrix here would teach nothing on the run where it times out. What this
  # proves is the part that is platform-shaped and therefore the part that breaks: the generator
  # runs with an MSVC triple, the binding builds and links WITHOUT Visual Studio's IDE, the C++
  # exception route that differs on Win64 works, and the sh-driven gates run under MSYS2.
  #
  # The full matrix is reachable by hand: `workflow_dispatch` with `windows_full: true`.
  windows:
    runs-on: windows-2022
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # `sh` is not optional: the gates are shell scripts, and `diffutils` is not in the default
      # MSYS2 install — without it `diff` is absent and a differential gate reports the comparison
      # it could not make as agreement (tools/win/preflight.ps1 records that measurement).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: diffutils

      # ORDER MATTERS: setup-dlang leaves DC pointing at the LAST compiler it installed, and that
      # is what `dub build` uses. ldc2 last, so the generator is built by the same compiler the
      # Linux job and the VM build it with — dmd is still installed, because the matrix needs both.
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: dmd-latest
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      # Qt is over a gigabyte and does not change between runs; the key carries the version so a
      # bump invalidates it rather than silently serving the old one.
      - name: Cache Qt
        id: qtcache
        uses: actions/cache@v4
        with:
          path: C:/Qt
          key: qt-windows-6.11.1-5.15.2-v1

      # py7zr is how get-qt.ps1 unpacks Qt's .7z archives; it is not on the runner by default.
      - name: py7zr
        if: steps.qtcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python -m pip install --disable-pip-version-check py7zr

      - name: Install Qt (from Qt's own repository, not aqtinstall)
        if: steps.qtcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./tools/win/get-qt.ps1 -Version 6.11.1 -Dest C:/Qt
          # Qt 5.15.2's MSVC build is msvc2019_64 — there is no msvc2022 one — and the modules the
          # Qt6 default names (qtwebchannel, qtpositioning, qtshadertools) are Qt6 spellings. The
          # Qt5 matrix here needs base + declarative, which the base package carries.
          ./tools/win/get-qt.ps1 -Version 5.15.2 -Dest C:/Qt -Arch win64_msvc2019_64 -Modules @()

      # xiboca links libclang, and on Windows that means the IMPORT LIBRARY, `libclang.lib`. The
      # runner's LLVM does not ship one - measured: `C:\Program Files\LLVM\lib` holds a single
      # `clang` directory and nothing else, and the build died on
      #     LINK : fatal error LNK1104: cannot open file 'libclang.lib'
      # Setting LIB and LIBPATH therefore changed nothing; there was no file to find.
      #
      # It is written to RUNNER_TEMP and not into the checkout: the report reads the working tree's
      # git status into its own header, and a file left in the workspace made a fresh clone report
      # `commit ded5f46 (DIRTY)`.
      #
      # The DLL is there, though, and an import library is derivable from a DLL's export table.
      # That is what this does, with LLVM's own tools: no Visual Studio shell, no 845 MB download
      # of the LLVM release archive that does ship the .lib, and no cache to go stale.
      - name: Derive libclang's import library from the DLL
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM"
          Write-Output ("lib\: " + ((Get-ChildItem "$llvm\lib" -EA SilentlyContinue).Name -join ' '))
          Write-Output ("bin *clang*: " + ((Get-ChildItem "$llvm\bin" -Filter '*clang*' -EA SilentlyContinue).Name -join ' '))
          $out = "$env:RUNNER_TEMP\llvmlib"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (Test-Path "$llvm\lib\libclang.lib") {
            Copy-Item "$llvm\lib\libclang.lib" $out
          } else {
            $dll = "$llvm\bin\libclang.dll"
            if (-not (Test-Path $dll)) { Write-Output "::error::no libclang.dll under $llvm\bin"; exit 1 }
            $names = & "$llvm\bin\llvm-readobj.exe" --coff-exports $dll |
                     Select-String -Pattern '^\s*Name:\s*(\S+)' |
                     ForEach-Object { $_.Matches[0].Groups[1].Value }
            if ($names.Count -lt 100) { Write-Output "::error::only $($names.Count) exports read"; exit 1 }
            Write-Output ("exports: " + $names.Count)
            $def = "$out\libclang.def"
            @("LIBRARY libclang.dll", "EXPORTS") + $names | Set-Content -LiteralPath $def -Encoding ascii
            & "$llvm\bin\llvm-dlltool.exe" -m i386:x86-64 -d $def -D libclang.dll -l "$out\libclang.lib"
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::llvm-dlltool failed"; exit 1 }
          }
          if (-not (Test-Path "$out\libclang.lib")) { Write-Output "::error::no libclang.lib produced"; exit 1 }
          Write-Output ("libclang.lib: " + (Get-Item "$out\libclang.lib").Length + " bytes")
          "LIB=$out;$llvm\lib;$env:LIB" >> $env:GITHUB_ENV
          "DFLAGS=-L/LIBPATH:`"$out`"" >> $env:GITHUB_ENV
          "PATH=$llvm\bin;$env:PATH" >> $env:GITHUB_ENV

      - name: What this machine has (preflight, advisory)
        shell: pwsh
        continue-on-error: true
        env:
          QTDIR6: C:/Qt/6.11.1/msvc2022_64
          QTDIR5: C:/Qt/5.15.2/msvc2019_64
        run: ./tools/win/preflight.ps1

      - name: Build the generator (xiboca)
        shell: pwsh
        run: cd xiboca; dub build

      - name: Generate the reggae build binary
        shell: pwsh
        run: dub run reggae -- -b binary . --reggaefile-import-path "$pwd/reggae"

      # THE SLICE, and why each family is in it. Every one of these is a place where Windows and
      # Linux genuinely differ, so a green row here means something a Linux row cannot mean:
      #   wraptest/borrowed/dangle  the wrapper's lifetime layer over the MSVC ABI
      #   uic*/qrc*                 the CTFE side-car tools, and `uicheck` carries the EXC verdict
      #                             that the Win64 exception route produces
      #   consumer-smoke/dub-*      the contract a user outside the tree meets
      #   deploy-*                  the PE half of qtd-deploy: no run path, DLLs beside the exe
      #   *-qt5                     the Qt5/Qt6 parity rule, on the platform where the two Qts are
      #                             separate installs rather than one distro's packages
      - name: Record execution (slice)
        id: slice
        if: github.event_name != 'workflow_dispatch' || inputs.windows_full != true
        shell: pwsh
        env:
          QTDIR6: C:/Qt/6.11.1/msvc2022_64
          QTDIR5: C:/Qt/5.15.2/msvc2019_64
        run: |
          ./tools/win/runreport.ps1 -Repo "$pwd" -Toolchain @() `
            -Tsv "$pwd/win-report.tsv" -Err "$pwd/win-report.err" `
            -Filter 'wraptest* borrowed* dangle* uic* qrc* hello* consumer-smoke* dub-consumer* deploy-* cannon* moc_test*' `
            -Wait

      - name: Record execution (full matrix, on request)
        id: full
        if: github.event_name == 'workflow_dispatch' && inputs.windows_full == true
        shell: pwsh
        env:
          QTDIR6: C:/Qt/6.11.1/msvc2022_64
          QTDIR5: C:/Qt/5.15.2/msvc2019_64
        run: |
          ./tools/win/runreport.ps1 -Repo "$pwd" -Toolchain @() `
            -Tsv "$pwd/win-report.tsv" -Err "$pwd/win-report.err" -Wait

      # The report's own totals line is the verdict. Read here rather than trusted, because a run
      # that stops mid-list looks exactly like one that finished — measured three times on the VM.
      # Gated on a record step having RUN. With a plain `always()` an earlier failure — the first
      # run died installing Qt — produced a second error about a report nothing had tried to write,
      # which buries the cause under its consequence.
      - name: Judge the report
        if: always() && (steps.slice.conclusion != 'skipped' || steps.full.conclusion != 'skipped')
        shell: bash
        run: |
          test -f win-report.tsv || { echo "::error::no report was produced"; tail -40 win-report.err || true; exit 1; }
          grep -a '^# totals' win-report.tsv || { echo "::error::the report has no totals line — it stopped mid-list"; tail -40 win-report.err || true; exit 1; }
          awk -F'\t' 'NR>3 && $6!="pass" && $6!="skip" {print $1"\t"$6}' win-report.tsv | head -40
          n=$(awk -F'\t' 'NR>3 && $6!="pass" && $6!="skip"' win-report.tsv | wc -l)
          test "$n" -eq 0 || { echo "::error::$n Windows target(s) did not pass"; exit 1; }

      # THE PER-TARGET LOGS TOO. Without them a failed row names a file that only existed on the
      # runner: the first real Windows run came back `42 pass, 8 fail` with an empty stderr, and
      # the eight reasons were in `.build/report-logs/` on a machine that no longer exists.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-report
          path: |
            win-report.tsv
            win-report.err
            .build/report-logs/
